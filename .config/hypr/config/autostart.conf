# Sync systemd and D-Bus activation environments with Wayland session variables
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME
exec-once = systemctl --user start hyprpolkitagent
exec-once = awww-daemon
exec-once = hypridle
exec-once = bash -c 'mkdir -p ~/.cache/quickshell/run/logs && quickshell -p ~/.config/hypr/scripts/quickshell/Shell.qml > ~/.cache/quickshell/run/logs/quickshell.log 2>&1'
exec-once = ~/.config/hypr/scripts/init.sh
exec-once = ~/.config/hypr/scripts/settings_watcher.sh &
exec-once = playerctld
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.config/hypr/scripts/hdmi_watcher.sh &
exec-once = bash ~/.config/hypr/scripts/turbo_inhibitor.sh sync &
exec-once = bash -c 'sleep 1 && ~/.config/hypr/scripts/qs_manager.sh toggle guide'
