env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = OZONE_PLATFORM,wayland
env = XDG_PICTURES_DIR,/home/anesu/Pictures
env = XDG_VIDEOS_DIR,/home/anesu/Videos
env = WALLPAPER_DIR,/home/anesu/Pictures/Wallpapers
env = SCRIPT_DIR,/home/anesu/.config/hypr/scripts
