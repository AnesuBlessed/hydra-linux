#
#  Hydra Linux Configuration
#
# --------------------------------------------------------------------------------------

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ HYPRIDLE CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    lock_cmd = bash ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 10 minutes: Lock session (inhibited when Turbo mode is active)
listener {
    condition_cmd = [ "$(powerprofilesctl get 2>/dev/null)" != "performance" ]
    condition_retry = 30
    timeout = 600
    on-timeout = loginctl lock-session
}

# 20 minutes: Suspend system (inhibited when Turbo mode is active)
listener {
    condition_cmd = [ "$(powerprofilesctl get 2>/dev/null)" != "performance" ]
    condition_retry = 30
    timeout = 1200
    on-timeout = systemctl suspend
}
