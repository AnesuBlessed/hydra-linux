# ══════════════════════════════════════════════════════════════════
# Hydra Linux – mpv config (Intel HD 620 / Wayland)
# ══════════════════════════════════════════════════════════════════

# ── Hardware acceleration ──
hwdec=vaapi
vo=gpu
gpu-context=wayland
profile=fast

# ── Cache (stream-friendly) ──
cache=yes
demuxer-max-bytes=64MiB
demuxer-max-back-bytes=16MiB

# ── Playback ──
keep-open=yes
save-position-on-quit=yes
watch-later-directory=~/.local/state/mpv/watch_later

# ── Audio ──
volume=80
volume-max=150
audio-file-auto=fuzzy

# ── Subtitles ──
sub-auto=fuzzy
sub-font="JetBrains Mono"
sub-font-size=36
sub-border-size=2
sub-border-color="#000000"
sub-color="#FFFFFF"
sub-shadow-offset=1
sub-shadow-color="#80000000"

# ── Anime deband (removes color banding common in anime) ──
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=20
deband-grain=5

# ── OSD ──
osd-font="JetBrains Mono"
osd-font-size=24
osd-border-size=1.5
osd-duration=2000

# ══════════════════════════════════════════════════════
# Anime4K shader profiles (toggle with keybinds)
# ══════════════════════════════════════════════════════

# iGPU-safe: Restore only (no upscale, minimal GPU load)
[anime4k-light]
profile-desc=Anime4K Light (iGPU safe)
glsl-shaders=~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_S.glsl:~~/shaders/Anime4K_Darken_Fast.glsl:~~/shaders/Anime4K_Thin_Fast.glsl

# Medium: Restore + light upscale (may drop frames on HD 620)
[anime4k-medium]
profile-desc=Anime4K Medium
glsl-shaders=~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl:~~/shaders/Anime4K_Darken_Fast.glsl:~~/shaders/Anime4K_Thin_Fast.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl

# Clear all shaders
[anime4k-off]
profile-desc=Anime4K Off
glsl-shaders=""
