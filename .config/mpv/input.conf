# ══════════════════════════════════════════════════════
# Hydra Linux – mpv keybinds for anime
# ══════════════════════════════════════════════════════

# Skip intro (85s) / outro (30s)
s           seek  85
S           seek  30
Ctrl+s      seek -85

# Anime4K shader toggle
Ctrl+1      apply-profile anime4k-light ; show-text "Anime4K: Light (iGPU)"
Ctrl+2      apply-profile anime4k-medium ; show-text "Anime4K: Medium"
Ctrl+0      apply-profile anime4k-off ; show-text "Anime4K: Off"

# Speed controls
[           multiply speed 0.9
]           multiply speed 1.1
BS          set speed 1.0

# Screenshot
p           screenshot

# Subtitle controls
v           cycle sub-visibility
j           cycle sub
J           cycle sub down

# Audio track
a           cycle audio
